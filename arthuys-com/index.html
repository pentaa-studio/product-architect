<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARTHUYS</title>
    <meta name="description" content="ARTHUYS" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='34' text-anchor='middle' fill='%23000'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        display: grid;
        place-items: center;
        background: #fff;
        color: #000;
        font-family: "Michroma", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Un mot-symbole très espacé, révélé lentement comme un logo de calandre. */
      h1 {
        --track: 0.42em;
        font-size: clamp(1.4rem, 5.2vw, 4.25rem);
        font-weight: 400;
        letter-spacing: var(--track);
        /* compense l'espace ajouté après la dernière lettre pour un centrage optique parfait */
        margin-right: calc(-1 * var(--track));
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        animation: reveal 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }

      @keyframes reveal {
        from { opacity: 0; letter-spacing: 1.1em; margin-right: -1.1em; filter: blur(6px); }
        to { opacity: 1; letter-spacing: var(--track); margin-right: calc(-1 * var(--track)); filter: blur(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <h1>ARTHUYS</h1>
  </body>
</html>
