<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARTHUYS</title>
    <meta name="description" content="ARTHUYS" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='34' text-anchor='middle' fill='%23000'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        display: grid;
        place-items: center;
        background: #fff;
        color: #000;
        font-family: "Michroma", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Un mot-symbole très espacé, révélé lentement comme un logo de calandre. */
      h1 {
        --track: 0.42em;
        font-size: clamp(1.4rem, 5.2vw, 4.25rem);
        font-weight: 400;
        letter-spacing: var(--track);
        /* compense l'espace ajouté après la dernière lettre pour un centrage optique parfait */
        margin-right: calc(-1 * var(--track));
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        animation: reveal 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }

      @keyframes reveal {
        from { opacity: 0; letter-spacing: 1.1em; margin-right: -1.1em; }
        to { opacity: 1; letter-spacing: var(--track); margin-right: calc(-1 * var(--track)); }
      }


      /* Survol : un reflet chromé suit le curseur, les lettres se soulèvent et s'écartent. */
      .word {
        position: relative;
        display: inline-flex;
        --mx: -9999px;
        --on: 0;
      }

      .word span {
        display: inline-block;
        will-change: transform;
        color: transparent;
        background-color: #000;
        background-image: linear-gradient(100deg, transparent 0%, #5a5a5a 36%, #e2e2e2 50%, #5a5a5a 64%, transparent 100%);
        background-repeat: no-repeat;
        background-size: 150px 100%;
        background-position: calc(var(--lx, -9999px) - 75px) 0;
        -webkit-background-clip: text;
        background-clip: text;
      }

      .word::after {
        content: "";
        position: absolute;
        left: 0;
        right: var(--track);
        bottom: -0.55em;
        height: 1px;
        background: #000;
        transform-origin: var(--mx) 50%;
        transform: scaleX(var(--line, 0));
      }

      @media (prefers-reduced-motion: reduce) {
        h1 { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <h1 aria-label="ARTHUYS"><span class="word" aria-hidden="true"><span>A</span><span>R</span><span>T</span><span>H</span><span>U</span><span>Y</span><span>S</span></span></h1>

    <script>
      (() => {
        const word = document.querySelector(".word");
        const letters = [...word.querySelectorAll("span")];
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        // Position du reflet (lissée) et intensité de l'effet.
        let target = { x: -400, on: 0 };
        const cur = { x: -400, on: 0 };
        let sweep = null;

        const local = (clientX) => clientX - word.getBoundingClientRect().left;

        addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          const r = word.getBoundingClientRect();
          const dy = Math.abs(e.clientY - (r.top + r.height / 2));
          const inX = e.clientX > r.left - r.height * 2 && e.clientX < r.right + r.height * 2;
          target.x = local(e.clientX);
          target.on = inX ? Math.max(0, 1 - dy / (r.height * 2.2)) : 0;
        });
        document.addEventListener("pointerleave", () => (target.on = 0));

        // Au toucher : un reflet traverse tout le mot.
        addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse") return;
          sweep = performance.now();
        });

        const loop = (now) => {
          const r = word.getBoundingClientRect();
          if (sweep !== null) {
            const t = Math.min(1, (now - sweep) / 1400);
            const ease = 1 - Math.pow(1 - t, 3);
            target.x = -80 + ease * (r.width + 160);
            target.on = t < 1 ? Math.sin(t * Math.PI) : 0;
            if (t >= 1) sweep = null;
          }
          cur.x += (target.x - cur.x) * 0.14;
          cur.on += (target.on - cur.on) * 0.08;

          word.style.setProperty("--mx", cur.x + "px");
          word.style.setProperty("--line", cur.on.toFixed(3));

          const em = parseFloat(getComputedStyle(word).fontSize);
          letters.forEach((el) => {
            const center = el.offsetLeft + el.offsetWidth / 2;
            const d = (center - cur.x) / (em * 1.4);
            const f = Math.exp(-d * d) * cur.on;
            const lift = -f * em * 0.16;
            const push = Math.tanh(d) * cur.on * em * 0.14 * (1 - Math.exp(-d * d) * 0.4);
            el.style.transform = `translate(${push.toFixed(2)}px, ${lift.toFixed(2)}px) scale(${(1 + f * 0.06).toFixed(3)})`;
            el.style.setProperty("--lx", (cur.on > 0.02 ? cur.x - el.offsetLeft : -9999) + "px");
          });
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
