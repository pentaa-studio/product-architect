<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARTHUYS</title>
    <meta name="description" content="ARTHUYS" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='34' text-anchor='middle' fill='%23000'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        background: #fff;
        color: #000;
        font-family: "Michroma", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        touch-action: manipulation;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Le mot reste lisible pour les lecteurs d'écran et sans JavaScript. */
      h1 {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(1.4rem, 5.2vw, 4.25rem);
        font-weight: 400;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
      }

      .js h1 {
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <h1>ARTHUYS</h1>
    <canvas aria-hidden="true"></canvas>
    <script>
      document.documentElement.classList.add("js");

      (async () => {
        const WORD = "ARTHUYS";
        const canvas = document.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

        try {
          await document.fonts.load('400 64px "Michroma"');
        } catch {}

        let W = 0, H = 0, dpr = 1, particles = [], size = 1.6;

        // Échantillonne le mot dessiné hors écran pour en faire des particules.
        function build() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const fontSize = Math.max(22, Math.min(W * 0.052, 68)) * (W < 600 ? 1.15 : 1);
          const track = fontSize * 0.42;
          const off = document.createElement("canvas");
          off.width = W;
          off.height = H;
          const o = off.getContext("2d");
          o.font = `400 ${fontSize}px Michroma, "Helvetica Neue", Arial, sans-serif`;
          o.textBaseline = "middle";
          o.fillStyle = "#000";

          const widths = [...WORD].map((c) => o.measureText(c).width);
          const total = widths.reduce((a, b) => a + b, 0) + track * (WORD.length - 1);
          let x = (W - total) / 2;
          [...WORD].forEach((c, i) => {
            o.fillText(c, x, H / 2);
            x += widths[i] + track;
          });

          const step = W < 600 ? 2 : fontSize > 50 ? 3 : 2;
          size = step * 0.9;
          const data = o.getImageData(0, 0, W, H).data;
          const prev = particles;
          particles = [];
          for (let y = 0; y < H; y += step) {
            for (let x = 0; x < W; x += step) {
              if (data[(y * W + x) * 4 + 3] > 128) {
                const p = prev[particles.length];
                particles.push({
                  hx: x,
                  hy: y,
                  x: p ? p.x : Math.random() * W,
                  y: p ? p.y : Math.random() * H,
                  vx: 0,
                  vy: 0,
                  // Chaque particule a son propre poids : l'explosion n'est pas uniforme.
                  m: 0.6 + Math.random() * 0.9,
                  delay: Math.random() * 0.5,
                });
              }
            }
          }
        }

        build();
        let resizeTimer;
        addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(build, 120);
        });

        // Curseur : position et vitesse, pour une explosion proportionnelle au geste.
        const mouse = { x: -9999, y: -9999, px: -9999, py: -9999, speed: 0 };
        addEventListener("pointermove", (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });
        document.addEventListener("pointerleave", () => {
          mouse.x = mouse.y = -9999;
        });

        function blast(cx, cy, power) {
          for (const p of particles) {
            const dx = p.x - cx;
            const dy = p.y - cy;
            const d = Math.hypot(dx, dy) || 1;
            const f = (power / (d * 0.04 + 1)) / p.m;
            const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.9;
            p.vx += Math.cos(a) * f * (0.5 + Math.random());
            p.vy += Math.sin(a) * f * (0.5 + Math.random());
          }
        }

        addEventListener("pointerdown", (e) => {
          if (!reduce) blast(e.clientX, e.clientY, 46);
        });

        const start = performance.now();

        function frame(now) {
          const t = (now - start) / 1000;
          const dx0 = mouse.x - mouse.px;
          const dy0 = mouse.y - mouse.py;
          const moved = mouse.px > -9000 && mouse.x > -9000 ? Math.hypot(dx0, dy0) : 0;
          mouse.speed += (moved - mouse.speed) * 0.35;
          mouse.px = mouse.x;
          mouse.py = mouse.y;

          const R = Math.max(80, Math.min(W, H) * 0.14);
          const push = 3.2 + Math.min(mouse.speed, 60) * 0.35;

          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = "#000";

          for (const p of particles) {
            // Retour élastique vers la lettre, après un départ décalé pour l'apparition.
            const intro = reduce ? 1 : Math.min(1, Math.max(0, (t - p.delay) / 1.2));
            const k = 0.02 + 0.05 * intro * intro;
            p.vx += (p.hx - p.x) * k;
            p.vy += (p.hy - p.y) * k;

            // Le curseur fait éclater les lettres qu'il traverse.
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < R * R) {
              const d = Math.sqrt(d2) || 1;
              const f = ((1 - d / R) ** 2 * push) / p.m;
              p.vx += (dx / d) * f + (Math.random() - 0.5) * f * 0.8;
              p.vy += (dy / d) * f + (Math.random() - 0.5) * f * 0.8;
            }

            p.vx *= 0.86;
            p.vy *= 0.86;
            p.x += p.vx;
            p.y += p.vy;

            // Les particules éloignées de leur lettre pâlissent un peu.
            const away = Math.min(1, Math.hypot(p.x - p.hx, p.y - p.hy) / 120);
            ctx.globalAlpha = 1 - away * 0.55;
            ctx.fillRect(p.x, p.y, size, size);
          }
          ctx.globalAlpha = 1;
          requestAnimationFrame(frame);
        }

        if (reduce) particles.forEach((p) => ((p.x = p.hx), (p.y = p.hy)));
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
